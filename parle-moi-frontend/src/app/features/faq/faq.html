<section class="faq-hero">
  <h1>Questions fréquentes</h1>
  <p>Tout ce qu'il faut savoir avant de commencer à parler.</p>
</section>

<section class="faq-liste">
  @for (item of items(); track item.question; let i = $index) {
    <div class="faq-item" [class.faq-item--ouvert]="ouvert() === i">
      <button type="button" class="faq-item__question" (click)="toggle(i)">
        {{ item.question }}
        <span class="faq-item__icone">{{ ouvert() === i ? '−' : '+' }}</span>
      </button>

      @if (ouvert() === i) {
        <p class="faq-item__reponse">{{ item.reponse }}</p>
      }
    </div>
  }
</section>

<section class="faq-cta">
  <p>Une question sans réponse ici ?</p>
  <a routerLink="/chat" class="btn btn--primary">Parlez-en directement</a>
</section>
