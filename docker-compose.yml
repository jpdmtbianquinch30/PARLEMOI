services:
  postgres:
    image: postgres:16
    container_name: parlemoi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: parlemoi
      POSTGRES_USER: parlemoi_user
      POSTGRES_PASSWORD: parlemoi_dev_password
    ports:
      - "5432:5432"
    volumes:
      - parlemoi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parlemoi_user -d parlemoi"]
      interval: 5s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:4.6.2-alpine
    container_name: parlemoi-coturn
    restart: unless-stopped
    command: >
      -n
      --log-file=stdout
      --min-port=49160
      --max-port=49200
      --lt-cred-mech
      --realm=parlemoi.local
      --static-auth-secret=${TURN_SECRET:-dev-only-turn-secret-change-before-prod}
      --no-cli
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

  minio:
    image: minio/minio:latest
    container_name: parlemoi-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-parlemoi_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-only-minio-secret-change-before-prod}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - parlemoi_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  parlemoi_pgdata:
  parlemoi_minio_data: