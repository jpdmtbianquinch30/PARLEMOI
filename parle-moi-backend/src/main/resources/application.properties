spring.application.name=parle-moi-backend

# Base de donnees
spring.datasource.url=jdbc:postgresql://localhost:5432/parlemoi
spring.datasource.username=parlemoi_user
spring.datasource.password=parlemoi_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - Flyway gere desormais le schema, plus jamais ddl-auto=update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# JWT - en dev uniquement ici en clair, OBLIGATOIRE de passer par une variable
# d'environnement JWT_SECRET en production (32 caracteres minimum pour HS256)
jwt.secret=${JWT_SECRET:dev-only-secret-please-change-this-before-prod-32chars}
jwt.expiration-ms=28800000

# Port du serveur
server.port=8080

# Empeche Spring Boot de generer un utilisateur en memoire avec mot de passe aleatoire
# (notre authentification est 100% JWT maison, ce mecanisme par defaut n'est jamais utilise)
spring.security.user.name=